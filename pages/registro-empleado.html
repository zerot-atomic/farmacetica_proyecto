<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Empleado</title>
    <link rel="stylesheet" href="../css/empleados-style.css">
</head>
<body>

    <header class="top-bar">
        <button class="hamburger" id="btn-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="../index.html"><h1>Farmacia Fortaleza</h1></a>
    </header>

    <!-- Sidebar de navegación -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Farmacia "Fortaleza"</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="proveedores.html">Proveedores</a></li>
                <li><a href="sucursales.html">Sucursales</a></li>
                <li><a href="admin.html" class="active">Administración</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Barra de breadcrumb -->
    <div class="breadcrumb-bar">
        <div id="breadcrumb-container"></div>
    </div>

    <main class="main-content">

        <form id="registroForm" class="form-group">
                <legend>Datos Personales</legend> <br>

                <label>Nombre:</label>
                <input type="text" id="nombre" required> <br>

                <label>Apellido:</label>
                <input type="text" id="apellido" required> <br>

                <label>Fecha de nacimiento:</label>
                <input type="date" id="fechaNacimiento" required> <br>

                <label>Correo electrónico:</label>
                <input type="email" id="correo" required> <br>

                <label>Teléfono:</label>
                <input type="text" id="telefono" required> <br><br>

                <legend>Datos Laborales</legend> <br>

                <label>Puesto:</label>
                <input type="text" id="puesto" required> <br>

                <label>Departamento:</label>
                <input type="text" id="departamento" required> <br>

                <label>Salario:</label>
                <input type="number" id="salario" required> <br>

                <label>Fecha de ingreso:</label>
                <input type="date" id="fechaIngreso" required> <br>

            <button type="submit">Registrar Empleado</button>

            <p id="mensajeError" class="error"></p>
            <p id="mensajeExito" class="exito"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Gestión Farmacéutica. Proyecto de Desarrollo Web Profesional.</p>
    </footer>

    <script src="../js/breadcrumb.js"></script>
    <script src="../js/validacion-empleados.js"></script>

<script>
    const btnMenu = document.getElementById("btn-menu");
    const sidebar = document.querySelector(".sidebar");
    const main = document.querySelector(".main-content");
    const topbar = document.querySelector(".top-bar");
    const footer = document.querySelector("footer");
    const breadcrumb = document.querySelector(".breadcrumb-bar");

    btnMenu.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        main.classList.toggle("active");
        topbar.classList.toggle("active");
        footer.classList.toggle("active");
        btnMenu.classList.toggle("active");
        if (breadcrumb) breadcrumb.classList.toggle("active");
    });
</script>
</body>
</html>

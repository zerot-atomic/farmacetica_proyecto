</head>

    <header class="top-bar">
        <button class="hamburger" id="btn-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="../index.html"><h1>Farmacia Fortaleza</h1></a>
    </header>

    <!-- Sidebar de navegación -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Farmacia "Fortaleza"</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="proveedores.html">Proveedores</a></li>

                <li><a href="admin.html">Administración</a></li>

        </nav>

    <script src="../js/breadcrumb.js"></script>

<script>
    const btnMenu = document.getElementById("btn-menu");
    const sidebar = document.querySelector(".sidebar");
    const main = document.querySelector(".main-content");
    const topbar = document.querySelector(".top-bar");
    const footer = document.querySelector("footer");
    const breadcrumb = document.querySelector(".breadcrumb-bar");

    btnMenu.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        main.classList.toggle("active");
        topbar.classList.toggle("active");
        footer.classList.toggle("active");
        btnMenu.classList.toggle("active");
        if (breadcrumb) breadcrumb.classList.toggle("active");
    });
</script>
